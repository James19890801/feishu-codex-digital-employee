name = "james-licensing"
main = "src/index.mjs"
compatibility_date = "2026-08-02"
compatibility_flags = ["nodejs_compat"]

[vars]
CONTACT_CARD_KEY = "james-wechat.jpg"
CONTACT_CARD_CONTENT_TYPE = "image/jpeg"

[[d1_databases]]
binding = "DB"
database_name = "james-licensing"
database_id = "fa256eee-d5e9-4395-a561-44af64bb6290"

[[kv_namespaces]]
binding = "CONTACT_CARD_KV"
id = "029e76f1b0264a2a8fdd0b4fa2ea5653"

# Secrets are provisioned with `wrangler secret put`; values never belong here:
# INVITATION_HASH_PEPPER
# RECOVERY_HASH_PEPPER
# LICENSE_SIGNING_PRIVATE_KEY
